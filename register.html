<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | AgriLink AI</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .register-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: #f5faf6;
        }

        .register-container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .register-logo {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #126b2f;
            margin-bottom: 10px;
        }

        .register-logo span {
            color: #2e8b46;
        }

        .register-container h1 {
            text-align: center;
            color: #18351f;
            margin-bottom: 8px;
        }

        .register-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #18351f;
        }

        .register-container input,
        .register-container select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .register-container input:focus,
        .register-container select:focus {
            border-color: #126b2f;
            box-shadow: 0 0 0 3px rgba(18, 107, 47, 0.10);
        }

        .register-container button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #126b2f;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-container button:hover {
            background: #0c5724;
            transform: translateY(-1px);
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #126b2f;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        .login-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login-text a {
            color: #126b2f;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>


<body>

    <main class="register-page">

        <div class="register-container">

            <div class="register-logo">
                🌱 AgriLink <span>AI</span>
            </div>

            <h1>Create Your Account</h1>

            <p class="register-subtitle">
                Join the future of smarter agriculture.
            </p>


            <!-- REGISTRATION FORM -->

            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="e.g. 0712345678"
                    >

                </div>


                <div class="form-group">

                    <label for="role">
                        I am a...
                    </label>

                    <select id="role" required>

                        <option value="">
                            Select your role
                        </option>

                        <option value="farmer">
                            👨‍🌾 Farmer
                        </option>

                        <option value="buyer">
                            🛒 Buyer
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="e.g. Nairobi, Kenya"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <button type="submit">
                    Create Account 🌱
                </button>

            </form>


            <div id="message" class="message"></div>


            <p class="login-text">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>


            <a href="index.html" class="back-home">
                ← Back to AgriLink AI
            </a>

        </div>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /*
         * Registration logic will connect to
         * your Supabase project.
         *
         * Keep your Supabase URL and ANON KEY
         * in script.script.js rather than putting
         * private keys in this page.
         */

        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            if (password !== confirmPassword) {

                message.style.display = "block";
                message.textContent =
                    "Passwords do not match.";

                return;
            }


            message.style.display = "block";
            message.textContent =
                "Registration form is ready. Connecting to AgriLink AI...";

        });

    </script>

</body>

</html>
