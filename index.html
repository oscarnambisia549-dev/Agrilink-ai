<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AgriLink AI - Register</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0c5c29,#2e8b46);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.register-box{
    width:100%;
    max-width:450px;
    background:white;
    padding:30px 25px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    color:#126b2f;
    margin-bottom:8px;
}

.logo span{
    color:#7b2cbf;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

h2{
    text-align:center;
    color:#18351f;
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    color:#18351f;
}

input,
select{
    width:100%;
    padding:13px;
    margin-bottom:16px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    background:white;
}

button{
    width:100%;
    padding:14px;
    background:#126b2f;
    color:white;
    border:none;
    border-radius:8px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(0.98);
}

#message{
    text-align:center;
    margin-top:16px;
    font-weight:bold;
    line-height:1.5;
}

.login{
    text-align:center;
    margin-top:20px;
    color:#555;
}

.login a{
    color:#126b2f;
    font-weight:bold;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="register-box">

<div class="logo">
🌱 AgriLink <span>AI</span>
</div>

<p class="subtitle">
One platform. Every farmer. A better future through AI. 🌱🚀
</p>

<h2>Create Farmer Account</h2>

<form id="register-form">

<label for="full_name">
Full Name
</label>

<input
type="text"
id="full_name"
placeholder="Enter your full name"
required
>

<label for="email">
Email
</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required
>

<label for="phone">
Phone Number
</label>

<input
type="tel"
id="phone"
placeholder="Enter your phone number"
required
>

<label for="location">
Farm Location
</label>

<input
type="text"
id="location"
placeholder="e.g. Nairobi, Kenya"
required
>

<label for="role">
I am a
</label>

<select id="role" required>

<option value="">
Select your role
</option>

<option value="farmer">
Farmer
</option>

<option value="buyer">
Buyer
</option>

</select>

<label for="password">
Password
</label>

<input
type="password"
id="password"
placeholder="Create a password"
required
>

<label
