<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriLink AI - Register</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#126b2f;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:450px;
    background:white;
    padding:30px 25px;
    border-radius:15px;
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    color:#126b2f;
    margin-bottom:10px;
}

.logo span{
    color:#7b2cbf;
}

h2{
    text-align:center;
    color:#18351f;
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:13px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#126b2f;
    color:white;
    font-size:17px;
    font-weight:bold;
}

#message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
    line-height:1.5;
}

.login{
    text-align:center;
    margin-top:20px;
}

.login a{
    color:#126b2f;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="box">

<div class="logo">
🌱 AgriLink <span>AI</span>
</div>

<h2>Create Farmer Account</h2>

<label>Full Name</label>

<input
type="text"
id="fullName"
placeholder="Enter your full name"
>

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter your email"
>

<label>Phone</label>

<input
type="tel"
id="phone"
placeholder="Enter your phone number"
>

<label>Farm Location</label>

<input
type="text"
id="location"
placeholder="e.g. Nairobi, Kenya"
>

<label>Role</label>

<select id="role">

<option value="">
Select your role
</option>

<option value="farmer">
Farmer
</option>

<option value="buyer">
Buyer
</option>

</select>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Create a password"
>

<label>Confirm Password</label>

<input
type="password"
id="confirmPassword"
placeholder="Confirm your password"
>

<button
type="button"
onclick="registerUser()"
>
🌱 Create Account
</button>

<div id="message"></div>

<div class="login">

Already have an account?

<a href="login.html">
Login
</a>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://cjgbeankvgtychqqgvlq.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_4Xv8GlAQ0eRDHX8MGDL00A_3-fjBrIj";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


async function registerUser(){

const message =
document.getElementById("message");

const fullName =
document.getElementById("fullName").value.trim();

const email =
document.getElementById("email").value.trim();

const phone =
document.getElementById("phone").value.trim();

const location =
document.getElementById("location").value.trim();

const role =
document.getElementById("role").value;

const password =
document.getElementById("password").value;

const confirmPassword =
document.getElementById("confirmPassword").value;


if(
!fullName ||
!email ||
!phone ||
!location ||
!role ||
!password ||
!confirmPassword
){

message.style.color="red";

message.textContent=
"❌ Please fill in every field.";

return;

}


if(password !== confirmPassword){

message.style.color="red";

message.textContent=
"❌ Passwords do not match.";

return;

}


if(password.length < 6){

message.style.color="red";

message.textContent=
"❌ Password must be at least 6 characters.";

return;

}


message.style.color="#126b2f";

message.textContent=
"🔄 Creating your account...";


try{

const {data,error} =
await db.auth.signUp({

email:email,

password:password,

options:{
data:{
full_name:fullName,
phone:phone,
location:location,
role:role
}
}

});


if(error){

message.style.color="red";

message.textContent=
"❌ "+error.message;

return;

}


if(!data.user){

message.style.color="red";

message.textContent=
"❌ Account was not created.";

return;
