<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriLink AI - Create Account</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0c5c29, #2e8b46);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 460px;
    background: white;
    padding: 30px 25px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.logo {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: #126b2f;
    margin-bottom: 8px;
}

.logo span {
    color: #7b2cbf;
}

.tagline {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
    font-size: 14px;
}

h2 {
    text-align: center;
    color: #18351f;
    margin-bottom: 20px;
}

label {
    display: block;
    margin: 13px 0 6px;
    font-weight: bold;
    color: #18351f;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #126b2f;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #126b2f;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    background: #777;
}

#message {
    margin-top: 16px;
    text-align: center;
    font-weight: bold;
    line-height: 1.5;
}

.login {
    text-align: center;
    margin-top: 20px;
    color: #555;
}

.login a {
    color: #126b2f;
    font-weight: bold;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        🌱 AgriLink <span>AI</span>
    </div>

    <div class="tagline">
        One platform. Every farmer. A better future through AI. 🌱🚀
    </div>

    <h2>Create Your Account</h2>

    <form id="registrationForm">

        <label for="fullName">Full Name</label>
        <input
            id="fullName"
            type="text"
            placeholder="Enter your full name"
            required
        >

        <label for="email">Email</label>
        <input
            id="email"
            type="email"
            placeholder="Enter your email"
            required
        >

        <label for="phone">Phone</label>
        <input
            id="phone"
            type="tel"
            placeholder="Enter your phone number"
            required
        >

        <label for="location">Farm Location</label>
        <input
            id="location"
            type="text"
            placeholder="e.g. Nairobi, Kenya"
            required
        >

        <label for="role">Role</label>
        <select id="role" required>
            <option value="">Select your role</option>
            <option value="farmer">Farmer</option>
            <option value="buyer">Buyer</option>
        </select>

        <label for="password">Password</label>
        <input
            id="password"
            type="password"
            placeholder="Create a password"
            minlength="6"
            required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
            id="confirmPassword"
            type="password"
            placeholder="Confirm your password"
            minlength="6"
            required
        >

        <button id="registerButton" type="submit">
            🌱 Create Account
        </button>

    </form>

    <div id="message"></div>

    <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script>

const SUPABASE_URL =
"https://cjgbeankvgtychqqgvlq.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_4Xv8GlAQ0eRDHX8MGDL00A_3-fjBrIj";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


const form = document.getElementById("registrationForm");
const message = document.getElementById("message");
const button = document.getElementById("registerButton");


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.style.color = "#126b2f";
    message.innerHTML = "🔄 Creating your AgriLink AI account...";

    button.disabled = true;
    button.innerText = "Creating account...";


    const fullName =
        document.getElementById("fullName").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const location =
        document.getElementById("location").value.trim();

    const role =
        document.getElementById("role").value;

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if (password !== confirmPassword) {

        message.style.color = "#c62828";
        message.innerHTML =
            "❌ Passwords do not match.";

        button.disabled = false;
        button.innerText = "🌱 Create Account";

        return;
    }


    if (password.length < 6) {

        message.style.color = "#c62828";
        message.innerHTML =
            "❌ Password must be at least 6 characters.";

        button.disabled = false;
        button.innerText = "🌱 Create Account";

        return;
    }


    try {

        /*
         * STEP 1
         * Create the Supabase Auth account
         */

        const { data, error } =
            await db.auth.signUp({
                email: email,
                password: password
            });


        if (error) {
            throw error;
        }


        if (!data.user) {
            throw new Error(
                "Account could not be created."
            );
        }


        /*
         * STEP 2
         * Save the farmer/buyer profile
         * using the Auth user's UUID.
         */

        const { error: profileError } =
            await db
                .from("users")
                .insert([
                    {
                        auth_id: data.user.id,
                        full_name: fullName,
                        email: email,
                        phone: phone,
                        location: location,
                        role: role
                    }
                ]);


        if (profileError) {

            console.error(
                "Profile error:",
                profileError
            );

            message.style.color = "#c62828";

            message.innerHTML =
                "⚠️ Your Auth account was created, but your profile could not be saved.<br><br>" +
                profileError.message;

            button.disabled = false;
            button.innerText = "🌱 Create Account";

            return;
        }


        /*
         * SUCCESS
         */

        message.style.color = "#126b2f";

        message.innerHTML =
            "✅ Account created successfully!<br>" +
            "Welcome to AgriLink AI 🌱🚀<br><br>" +
            "Redirecting to your dashboard...";


        setTimeout(function() {

            window.location.href =
                "dashboard.html";

        }, 2000);


    } catch (error) {

        console.error(
            "Registration error:",
            error
        );

        message.style.color = "#c62828";

        message.innerHTML =
            "❌ Registration failed.<br><br>" +
            error.message;

        button.disabled = false;
        button.innerText = "🌱 Create Account";
    }

});

</script>

</body>
</html>
