<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriLink AI Dashboard</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5faf6;
    color:#18351f;
}

nav{
    background:#126b2f;
    color:white;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#b9f6c8;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.container{
    max-width:1150px;
    margin:auto;
    padding:35px 7%;
}

.hero{
    background:linear-gradient(135deg,#0c5c29,#2e8b46);
    color:white;
    padding:55px 7%;
}

.hero h1{
    font-size:42px;
    margin-bottom:12px;
}

.hero p{
    font-size:18px;
}

.card{
    background:white;
    margin-top:25px;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 18px rgba(0,0,0,0.08);
}

.card h2{
    color:#126b2f;
    margin-bottom:12px;
}

button{
    background:#126b2f;
    color:white;
    border:none;
    padding:13px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

button:hover{
    background:#0c5223;
}

input,
select{
    width:100%;
    padding:13px;
    margin:8px 0 15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

label{
    font-weight:bold;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
}

.produce-item{
    background:#f5faf6;
    border:1px solid #d8eadc;
    padding:16px;
    margin-top:12px;
    border-radius:10px;
}

.produce-item strong{
    color:#126b2f;
}

.delete-btn{
    background:#b3261e;
    margin-top:10px;
    padding:9px 14px;
    font-size:14px;
}

.delete-btn:hover{
    background:#8c1d18;
}

.weather-box{
    background:#f5faf6;
    border:1px solid #d8eadc;
    padding:18px;
    border-radius:10px;
    margin-top:15px;
    line-height:1.8;
}

footer{
    margin-top:40px;
    background:#18351f;
    color:white;
    text-align:center;
    padding:25px;
}

.small{
    color:#666;
    font-size:14px;
    margin-top:8px;
}

</style>
</head>

<body>

<!-- NAVIGATION -->

<nav>

    <div class="logo">
        🌱 AgriLink <span>AI</span>
    </div>

    <a href="index.html">Home</a>

</nav>


<!-- HERO -->

<section class="hero">

    <h1>Farmer Dashboard 🌱</h1>

    <p>
        One platform. Every farmer. A better future through AI. 🚀
    </p>

</section>


<div class="container">


<!-- WEATHER -->

<div class="card">

    <h2>🌦️ Weather</h2>

    <p>
        Get current weather information for farming.
    </p>

    <div id="weather-info" class="weather-box">
        ⏳ Loading weather...
    </div>

</div>


<!-- MY PRODUCE -->

<div class="card">

    <h2>🌽 My Produce</h2>

    <p>
        Add the crops
