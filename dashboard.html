<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgriLink AI - Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c5c29, #2e8b46);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px 25px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #126b2f;
            margin-bottom: 10px;
        }

        .logo span {
            color: #7b2cbf;
        }

        h2 {
            text-align: center;
            color: #18351f;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #18351f;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #126b2f;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0c5c29;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #126b2f;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        🌱 AgriLink <span>AI</span>
    </div>

    <h2>Farmer Login</h2>

    <label for="email">Email</label>
    <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
    >

    <label for="password">Password</label>
    <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
    >

    <button onclick="login()">
        🔐 Login
    </button>

    <div id="message"></div>

    <div class="register">
        Don't have an account?
        <a href="index.html">Register</a>
    </div>

</div>

<script>

const SUPABASE_URL =
    "https://cjgbeankvgtychqqgvlq.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_4Xv8GlAQ0eRDHX8MGDL00A_3-fjBrIj";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

async function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    if (!email || !password) {

        message.style.color = "red";

        message.textContent =
            "❌ Please enter your email and password.";

        return;
    }

    message.style.color = "#126b2f";

    message.textContent =
        "🔄 Logging in...";

    const { data, error } =
        await db.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {

        message.style.color = "red";

        message.textContent =
            "❌ " + error.message;

        return;
    }

    message.style.color = "#126b2f";

    message.textContent =
        "✅ Login successful!";

    setTimeout(() => {

        window.location.href =
            "dashboard.html";

    }, 1000);
}

</script>

</body>
</html>
