*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;

body{

    color:#18351f;
}

/* NAVIGATION */

nav{
    background:#126b2f;
    color:white;
    padding:18px 7%;

    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#b9f6c8;
}

.logout{
    background:#ffffff;

    border:none;
    padding:10px 18px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

/* HERO */

.hero{
    background:linear-gradient(135deg,#0c5c29,#2e8b46);
    color:white;
    padding:60px 7%;
}

.hero-content{
    max-width:1150px;
    margin:auto;
}

.hero h1{
    font-size:clamp(38px,6vw,65px);
    margin-bottom:15px;
}

.hero p{
    font-size:18px;
    margin-bottom:25px;
}

    color:#18351f;
