<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriLink AI Dashboard</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5faf6;
    color:#18351f;
    line-height:1.6;
}

header{
    background:linear-gradient(135deg,#126b2f,#2e8b46);
    color:white;
    padding:35px 20px;
    text-align:center;
}

header h1{
    font-size:36px;
    margin-bottom:8px;
}

header p{
    font-size:16px;
}

nav{
    background:#0d5426;
    padding:14px 20px;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

nav a:hover{
    color:#b9f6c8;
}

main{
    max-width:1100px;
    margin:auto;
    padding:30px 20px;
}

.card{
    background:white;
    border-radius:15px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 5px 18px rgba(0,0,0,.10);
    border-left:5px solid #2e8b46;
}

.card h2{
    color:#126b2f;
    margin-bottom:15px;
}

.card h3{
    color:#126b2f;
}

button{
    background:#126b2f;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

button:hover{
    background:#0d542
