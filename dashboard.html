<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AgriLink AI - Farmer Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #f5faf6;
            color: #18351f;
        }

        header {
            background: #126b2f;
            color: white;
            padding: 22px 7%;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 6px;
            opacity: 0.9;
        }

        .container {
            max-width: 1150px;
            margin: auto;
            padding: 30px 7%;
        }

        .welcome {
            background: linear-gradient(
                135deg,
                #0c5c29,
                #2e8b46
            );

            color: white;
            padding: 30px;
            border-radius: 18px;
            margin-bottom: 25px;
        }

        .welcome h2 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .cards {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 18px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;

            box-shadow:
                0 5px 18px
                rgba(0,0,0,0.08);
        }

        .icon {
            font-size: 35px;
            margin-bottom: 12px;
        }

        .card h3 {
            margin-bottom: 8px;
            color: #126b2f;
        }

        .card p {
            color: #55705c;
            line-height: 1.5;
        }

        .section-title {
            margin: 35px 0 15px;
            font-size: 25px;
        }

        .button {
            display: inline-block;

            margin-top: 15px;

            padding: 12px 18px;

            background: #126b2f;
            color: white;

            text-decoration: none;
            border-radius: 8px;
