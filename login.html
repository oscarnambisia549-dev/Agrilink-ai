<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriLink AI - Supabase Test</title>

<style>
body{
    margin:0;
    min-height:100vh;
    background:#126b2f;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    padding:20px;
}

.box{
    width:100%;
    max-width:430px;
    background:white;
    padding:30px;
    border-radius:16px;
    text-align:center;
}

h1{
    color:#126b2f;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:0;
    border-radius:8px;
    background:#126b2f;
    color:white;
    font-size:17px;
    font-weight:bold;
}

#result{
    margin-top:20px;
    font-weight:bold;
    line-height:1.5;
}
</style>

</head>

<body>

<div class="box">

<h1>🌱 AgriLink AI</h1>

<h2>Supabase Connection Test</h2>

<button onclick="testSupabase()">
🔐 TEST SUPABASE
</button>

<div id="result"></div>

</div>


<script>

function testSupabase(){

    const result =
        document.getElementById("result");

    result.innerHTML =
        "🔄 Checking Supabase library...";

    if(
        typeof window.supabase === "undefined"
    ){

        result.style.color = "#c62828";

        result.innerHTML =
            "❌ Supabase library is NOT loading.";

        return;
    }

    result.style.color = "#126b2f";

    result.innerHTML =
        "✅ Supabase library is loading correctly.";

}

</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</body>

</html>
