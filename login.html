<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriLink AI - Auth Test</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    min-height:100vh;
    background:#126b2f;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    padding:20px;
}

.box{
    width:100%;
    max-width:430px;
    background:white;
    padding:30px;
    border-radius:16px;
    text-align:center;
}

h1{
    color:#126b2f;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:0;
    border-radius:8px;
    background:#126b2f;
    color:white;
    font-size:17px;
    font-weight:bold;
}

#result{
    margin-top:20px;
    font-weight:bold;
    line-height:1.6;
}
</style>
</head>

<body>

<div class="box">

<h1>🌱 AgriLink AI</h1>

<h2>Supabase Auth Test</h2>

<button onclick="testConnection()">
🔐 TEST CONNECTION
</button>

<div id="result"></div>

</div>

<script>

const SUPABASE_URL =
"https://cjgbeankvgtychqqgvlq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4Xv8GlAQ0eRDHX8MGDL00A_3-fjBrIj";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function testConnection(){

    const result =
    document.getElementById("result");

    result.style.color="#126b2f";
    result.innerHTML="🔄 Connecting to Supabase...";

    try{

        const { data, error } =
        await supabaseClient.auth.getSession();

        if(error){

            result.style.color="#c62828";

            result.innerHTML =
            "❌ Supabase connection failed.<br><br>" +
            error.message;

            return;
        }

        result.style.color="#126b2f";

        result.innerHTML =
        "✅ SUPABASE CONNECTION SUCCESSFUL!<br><br>" +
        "🌱 Authentication service is responding.";

    }catch(error){

        result.style.color="#c62828";

        result.innerHTML =
        "❌ ERROR<br><br>" +
        error.message;
    }
}

</script>

</body>
</html>
