<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriLink AI - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0c5c29,#2e8b46);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:white;
    padding:35px 28px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,0.25);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#126b2f;
    margin-bottom:10px;
}

.logo span{
    color:#7b2cbf;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:28px;
}

h2{
    text-align:center;
    color:#18351f;
    margin-bottom:22px;
}

label{
    display:block;
    font-weight:bold;
    color:#18351f;
    margin:15px 0 7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#126b2f;
}

button{
    width:100%;
    margin-top:24px;
    padding:15px;
    border:none;
    border-radius:9px;
    background:#126b2f;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#777;
}

#message{
    text-align:center;
    margin-top:18px;
    font-weight:bold;
    line-height:1.5;
}

.register{
    text-align:center;
    margin-top:22px;
    color:#555;
}

.register a{
    color:#126b2f;
    font-weight:bold;
    text-decoration:none;
}

.back{
    text-align:center;
    margin-top:15px;
}

.back a{
    color:#7b2cbf;
    text-decoration:none;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        🌱 AgriLink <span>AI</span>
    </div>

    <div class="subtitle">
        One platform. Every farmer. A better future through AI.
    </div>

    <h2>Welcome Back 👋</h2>

    <label for="email">Email</label>

    <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
    >

    <label for="password">Password</label>

    <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
    >

    <button id="loginButton" type="button" onclick="loginUser()">
        🔐 Login
    </button>

    <div id="message"></div>

    <div class="register">
        Don't have an account?
        <a href="index.html">Register</a>
    </div>

    <div class="back">
        <a href="index.html">← Back to AgriLink AI</a>
    </div>

</div>

<script>

const SUPABASE_URL =
"https://cjgbeankvgtychqqgvlq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4Xv8GlAQ0eRDHX8MGDL00A_3-fjBrIj";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


async function loginUser(){

    const email =
    document.getElementById("email").value.trim();

    const password =
    document.getElementById("password").value;

    const message =
    document.getElementById("message");

    const button =
    document.getElementById("loginButton");


    if(email === "" || password === ""){

        message.style.color="#c62828";

        message.innerHTML =
        "❌ Please enter your email and password.";

        return;
    }


    button.disabled=true;

    button.innerHTML="🔄 Logging in...";

    message.style.color="#126b2f";

    message.innerHTML="Connecting to AgriLink AI...";


    try{

        const { data, error } =
        await supabaseClient.auth.signInWithPassword({

            email:email,

            password:password

        });


        if(error){

            message.style.color="#c62828";

            message.innerHTML =
            "❌ Login failed.<br><br>" +
            error.message;

            button.disabled=false;

            button.innerHTML="🔐 Login";

            return;
        }


        localStorage.setItem(
            "agrilink_user",
            data.user.id
        );


        message.style.color="#126b2f";

        message.innerHTML =
        "✅ Login successful!<br><br>" +
        "🌱 Welcome back to AgriLink AI!";


        setTimeout(function(){

            window.location.href="dashboard.html";

        },1000);


    }catch(error){

        message.style.color="#c62828";

        message.innerHTML =
        "❌ Something went wrong.<br><br>" +
        error.message;

        button.disabled=false;

        button.innerHTML="🔐 Login";
    }

}

</script>

</body>
</html>
