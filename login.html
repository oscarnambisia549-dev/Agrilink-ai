<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriLink AI Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:#126b2f;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:430px;
    background:white;
    padding:30px 25px;
    border-radius:16px;
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#126b2f;
    margin-bottom:25px;
}

.logo span{
    color:#7b2cbf;
}

h2{
    text-align:center;
    color:#18351f;
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin:14px 0 6px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#126b2f;
    color:white;
    font-size:17px;
    font-weight:bold;
}

#message{
    text-align:center;
    margin-top:18px;
    font-weight:bold;
    line-height:1.5;
}

.register{
    text-align:center;
    margin-top:20px;
}

.register a{
    color:#126b2f;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">
🌱 AgriLink <span>AI</span>
</div>

<h2>Farmer Login</h2>

<label>Email</label>
<input id="email" type="email" placeholder="Enter your email">

<label>Password</label>
<input id="password" type="password" placeholder="Enter your password">

<button type="button" onclick="loginUser()">
🔐 Login
</button>

<div id="message"></div>

<div class="register">
Don't have an account?
<a href="index.html">Register</a>
</div>

</div>

<script>

const SUPABASE_URL =
"https://cjgbeankvgtychqqgvlq.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_4Xv8GlAQ0eRDHX8MGDL00A_3-fjBrIj";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

function loginUser(){

    const message =
        document.getElementById("message");

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    message.style.color = "#126b2f";

    message.innerHTML =
        "🔄 Logging in...";

    if(!email || !password){

        message.style.color = "#c62828";

        message.innerHTML =
            "❌ Please enter your email and password.";

        return;
    }

    db.auth.signInWithPassword({
        email: email,
        password: password
    })
    .then(function(result){

        if(result.error){

            throw result.error;
        }

        message.style.color = "#126b2f";

        message.innerHTML =
            "✅ Login successful!<br>" +
            "Opening your dashboard...";

        setTimeout(function(){

            window.location.href =
                "dashboard.html";

        },1000);

    })
    .catch(function(error){

        console.error(error);

        message.style.color = "#c62828";

        message.innerHTML =
            "❌ Login failed.<br><br>" +
            error.message;
    });
}

</script>

</body>
</html>
