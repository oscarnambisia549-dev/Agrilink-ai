<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0c5c29, #2e8b46);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 32px 25px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.logo {
    text-align: center;
    font-size: 29px;
    font-weight: bold;
    color: #126b2f;
    margin-bottom: 8px;
}

.logo span {
    color: #7b2cbf;
}

.tagline {
    text-align: center;
    color: #666;
    font-size: 14px;
    margin-bottom: 28px;
}

h2 {
    text-align: center;
    color: #18351f;
    margin-bottom: 22px;
}

label {
    display: block;
    margin: 14px 0 6px;
    font-weight: bold;
    color: #18351f;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #126b2f;
}

button {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #126b2f;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    background: #777;
    cursor: not-allowed;
}

#message {
    margin-top: 18px;
    text-align: center;
    font-weight: bold;
    line-height: 1.5;
    word-wrap: break-word;
}

.register {
    text-align: center;
    margin-top: 22px;
    color: #555;
}

.register a {
    color: #126b2f;
    font-weight: bold;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        🌱 AgriLink <span>AI</span>
    </div>

    <div class="tagline">
        One platform. Every farmer. A better future through AI. 🌱🚀
    </div>

    <h2>Farmer Login</h2>

    <label for="email">Email</label>

    <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
    >

    <label for="password">Password</label>

    <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
    >

    <button
        id="loginButton"
        type="button"
        onclick="loginUser()"
    >
        🔐 Login
    </button>

    <div id="message"></div>

    <div class="register">
        Don't have an account?
        <a href="index.html">Register</a>
    </div>

</div>
