<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriLink AI Login Test</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    min-height:100vh;
    background:#126b2f;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    padding:20px;
}

.box{
    width:100%;
    max-width:430px;
    background:white;
    padding:30px;
    border-radius:16px;
}

h1{
    text-align:center;
    color:#126b2f;
}

label{
    display:block;
    font-weight:bold;
    margin-top:18px;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:14px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:22px;
    border:0;
    border-radius:8px;
    background:#126b2f;
    color:white;
    font-size:17px;
    font-weight:bold;
}

#result{
    margin-top:20px;
    text-align:center;
    font-weight:bold;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="box">

<h1>🌱 AgriLink AI</h1>

<h2>Login Test</h2>

<label>Email</label>
<input
    id="email"
    type="email"
    placeholder="Enter your email"
>

<label>Password</label>
<input
    id="password"
    type="password"
    placeholder="Enter your password"
>

<button onclick="testLogin()">
🔐 TEST LOGIN
</button>

<div id="result"></div>

</div>

<script>

const SUPABASE_URL =
"https://cjgbeankvgtychqqgvlq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4Xv8GlAQ0eRDHX8MGDL00A_3-fjBrIj";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function testLogin(){

    const result =
    document.getElementById("result");

    const email =
    document.getElementById("email").value.trim();

    const password =
    document.getElementById("password").value;

    if(!email || !password){

        result.style.color="#c62828";

        result.innerHTML =
        "❌ Enter your email and password.";

        return;
    }

    result.style.color="#126b2f";
    result.innerHTML="🔄 Checking login...";

    try{

        const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email:email,
            password:password
        });

        if(error){

            result.style.color="#c62828";

            result.innerHTML =
            "❌ LOGIN FAILED<br><br>" +
            error.message;

            return;
        }

        result.style.color="#126b2f";

        result.innerHTML =
        "✅ LOGIN SUCCESSFUL!<br><br>" +
        "🌱 User ID:<br>" +
        data.user.id;

    }catch(error){

        result.style.color="#c62828";

        result.innerHTML =
        "❌ ERROR<br><br>" +
        error.message;
    }
}

</script>

</body>
</html>
